<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小谨的游戏厅</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f14;color:#e8f1ff;
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
    display:flex;align-items:center;justify-content:center}
  .wrap{width:100%;max-width:460px;padding:24px}
  h1{font-size:22px;margin:0 0 6px;color:#8fe4ff;text-align:center;letter-spacing:2px}
  p.sub{margin:0 0 26px;text-align:center;color:#7d93a8;font-size:13px}
  a.card{display:block;margin:14px 0;padding:18px 20px;border-radius:16px;
    background:linear-gradient(135deg,#16303f,#101a24);
    border:1px solid rgba(120,200,255,.22);text-decoration:none;color:#dff2ff}
  a.card:active{transform:scale(.985);border-color:rgba(120,220,255,.6)}
  .t{font-size:17px;font-weight:700;margin-bottom:6px}
  .d{font-size:12.5px;color:#8ea6bb;line-height:1.6}
  .tag{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:8px;
    background:rgba(95,208,255,.14);color:#7fd4ff}
</style>
</head>
<body>
<div class="wrap">
  <h1>小 谨 游 戏 厅</h1>
  <p class="sub">点一个就能玩 · 不用联网下载</p>

  <a class="card" href="game3d.html">
    <div class="t">深渊回廊 · 3D</div>
    <div class="d">第一人称射击。三把枪、开镜、会走位的敌人、天上飘过的大肥鱼。</div>
    <span class="tag">推荐 · 横屏</span>
  </a>

  <a class="card" href="game2d.html">
    <div class="t">孤岛枪线 · 2D</div>
    <div class="d">单屏俯视竞技场。毒圈缩小、自动瞄准最近的敌人，适合单手玩。</div>
    <span class="tag">轻量 · 竖屏横屏都行</span>
  </a>
</div>
</body>
</html>
